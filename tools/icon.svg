<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset=".45" stop-color="#d4d5da"/>
      <stop offset=".6" stop-color="#e6e7ea"/>
      <stop offset="1" stop-color="#b9bbc1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a21"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="wheel" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset=".85" stop-color="#b8bbc0"/>
    </radialGradient>
    <radialGradient id="center" cx=".42" cy=".36" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3c6cb"/>
    </radialGradient>
    <pattern id="brush" width="512" height="3" patternUnits="userSpaceOnUse">
      <rect width="512" height="1" fill="#ffffff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#body)"/>
  <rect width="512" height="512" fill="url(#brush)"/>

  <!-- screen -->
  <rect x="146" y="92" width="220" height="112" rx="14" fill="#0a0b0d"/>
  <rect x="153" y="99" width="206" height="98" rx="8" fill="url(#screen)"/>
  <text x="256" y="152" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700"
        font-size="40" letter-spacing="4" fill="#8fce9b">FLEX</text>
  <rect x="176" y="172" width="160" height="5" rx="2.5" fill="#242a32"/>
  <rect x="176" y="172" width="98" height="5" rx="2.5" fill="#8fce9b"/>

  <!-- click wheel -->
  <circle cx="256" cy="330" r="102" fill="#9ea1a7" opacity=".5"/>
  <circle cx="256" cy="330" r="100" fill="url(#wheel)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" fill="#6f7378" text-anchor="middle">
    <text x="256" y="263" font-size="17" letter-spacing="1">MENU</text>
  </g>
  <g fill="#6f7378">
    <!-- ◀◀ -->
    <path d="M186 330 l12 -8 v16 z M174 330 l12 -8 v16 z"/>
    <!-- ▶▶ -->
    <path d="M326 330 l-12 -8 v16 z M338 330 l-12 -8 v16 z"/>
    <!-- ▶❚❚ -->
    <path d="M238 391 l13 8 l-13 8 z"/>
    <rect x="256" y="391" width="4.5" height="16"/>
    <rect x="264" y="391" width="4.5" height="16"/>
  </g>
  <circle cx="256" cy="331" r="42" fill="#9ea1a7" opacity=".45"/>
  <circle cx="256" cy="330" r="41" fill="url(#center)"/>
</svg>
